name: Fix frontend compatibility layer

on:
  push:
    branches:
      - agent/parkmaster-final-integration-20260730
    paths:
      - .github/workflows/fix-frontend-compat.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/parkmaster-final-integration-20260730

      - name: Apply compatibility fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          compat = "src/integrations/api/supabase-compat.ts"

          replace_once(
              compat,
              ' *   .order(col, { ascending? })\n',
              ' *   .or(), .not(), .order(col, { ascending?, nullsFirst? })\n',
          )
          replace_once(
              compat,
              ' *   - .channel() / realtime                   → 코드에 0회. 미사용\n',
              ' *   - 실시간 연결은 자체 WebSocket 전환 전까지 호환 채널(no-op)로 제공\n',
          )
          replace_once(
              compat,
              '  headOnly?: boolean;\n',
              '  headOnly?: boolean;\n  /** Supabase .or() 호환용 원본 표현식 */\n  orExpression?: string;\n',
          )
          replace_once(
              compat,
              '''    if (detectJoinSelect(columns)) {
      throw new Error(
        `[supabase-compat] JOIN 형식 select('${columns}')는 호환 shim에서 지원되지 않습니다.\\n` +
        `백엔드(/api/${this.state.table.replace(/_/g, "-")})에 전용 엔드포인트를 추가해 처리하세요.`,
      );
    }
''',
              '''    if (detectJoinSelect(columns)) {
      const { joins } = parseJoinSelect(columns);
      this.state.joins = joins;
    }
''',
          )
          replace_once(
              compat,
              'class QueryBuilder<T = unknown> implements PromiseLike<ExecResult<T>> {',
              'class QueryBuilder<T = any> implements PromiseLike<ExecResult<T>> {',
          )
          replace_once(
              compat,
              '  contains(col: string, val: unknown): this { return this.addFilter("contains", col, val); }\n',
              '''  contains(col: string, val: unknown): this { return this.addFilter("contains", col, val); }

  /**
   * Supabase의 OR 문자열 중 가장 흔한 `col.ilike.%검색어%` 묶음을
   * 백엔드 공통 검색 파라미터 q로 변환한다.
   */
  or(expression: string): this {
    this.state.orExpression = expression;
    return this;
  }

  /** Supabase .not(col, op, value)의 주요 사용 패턴을 자체 필터로 변환한다. */
  not(col: string, operator: string, val: unknown): this {
    if (operator === "eq" || operator === "is") return this.addFilter("neq", col, val);
    console.warn(`[supabase-compat] .not(${col}, ${operator}, ...)는 완전 지원되지 않아 제외 필터로 처리합니다.`);
    return this.addFilter("neq", col, val);
  }
''',
          )
          replace_once(
              compat,
              '  order(col: string, opts?: { ascending?: boolean }): this {',
              '  order(col: string, opts?: { ascending?: boolean; nullsFirst?: boolean; foreignTable?: string; referencedTable?: string }): this {',
          )
          replace_once(
              compat,
              '    const query: Record<string, unknown> = flattenFilters(state.filters);\n',
              '''    const query: Record<string, unknown> = flattenFilters(state.filters);
    if (state.orExpression) {
      const parts = state.orExpression.split(",").map((part) => part.trim()).filter(Boolean);
      const values = parts
        .map((part) => part.match(/^[^.]+\\.ilike\\.(.*)$/)?.[1])
        .filter((value): value is string => Boolean(value));
      if (values.length === parts.length && new Set(values).size === 1) {
        query.q = values[0].replace(/^%|%$/g, "");
      } else {
        query.or = state.orExpression;
      }
    }
''',
          )
          replace_once(
              compat,
              '// ───── public surface ─────\n\nexport const supabase = {\n  from<T = unknown>(table: string): QueryBuilder<T> {',
              '''// ───── public surface ─────

type RealtimeCallback = (payload: any) => void;

class RealtimeChannelCompat {
  on(_type: string, _filter: Record<string, unknown>, _callback: RealtimeCallback): this {
    return this;
  }

  subscribe(callback?: (status: string) => void): this {
    queueMicrotask(() => callback?.("SUBSCRIBED"));
    return this;
  }

  async unsubscribe(): Promise<{ status: "ok" }> {
    return { status: "ok" };
  }
}

export const supabase = {
  from<T = any>(table: string): QueryBuilder<T> {''',
          )
          replace_once(
              compat,
              '  // auth, storage, functions는 별도 모듈에서 import 권장.\n',
              '''  channel(_name: string): RealtimeChannelCompat {
    return new RealtimeChannelCompat();
  },

  async removeChannel(channel: RealtimeChannelCompat): Promise<{ status: "ok" }> {
    return channel.unsubscribe();
  },

  // auth, storage, functions는 별도 모듈에서 import 권장.
''',
          )

          profile = "src/pages/Profile.tsx"
          replace_once(
              profile,
              '  const [newPassword, setNewPassword] = useState("");\n',
              '  const [currentPassword, setCurrentPassword] = useState("");\n  const [newPassword, setNewPassword] = useState("");\n',
          )
          replace_once(
              profile,
              '      setNewPassword("");\n      setConfirmPassword("");\n',
              '      setCurrentPassword("");\n      setNewPassword("");\n      setConfirmPassword("");\n',
          )
          replace_once(
              profile,
              '''          <CardContent className="space-y-4">
            <div className="relative">
              <Label>새 비밀번호</Label>
''',
              '''          <CardContent className="space-y-4">
            <div>
              <Label>현재 비밀번호</Label>
              <Input
                type="password"
                value={currentPassword}
                onChange={(e) => setCurrentPassword(e.target.value)}
                autoComplete="current-password"
              />
            </div>

            <div className="relative">
              <Label>새 비밀번호</Label>
''',
          )
          replace_once(
              profile,
              '              disabled={passedChecks < 4 || newPassword !== confirmPassword || changePasswordMutation.isPending}\n',
              '              disabled={!currentPassword || passedChecks < 4 || newPassword !== confirmPassword || changePasswordMutation.isPending}\n',
          )
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/api/supabase-compat.ts src/pages/Profile.tsx
          git commit -m "fix: 프론트 자체 API 호환 계층과 비밀번호 변경 복구"
          git push origin HEAD:agent/parkmaster-final-integration-20260730
