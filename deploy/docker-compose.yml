# ParkMaster overlay for the official self-hosted Supabase Docker stack.
# Run this file together with the pinned official docker-compose.yml.
services:
  kong:
    ports: !override
      - "127.0.0.1:${KONG_HTTP_PORT}:8000/tcp"
      - "127.0.0.1:${KONG_HTTPS_PORT}:8443/tcp"

  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432/tcp"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543/tcp"

  functions:
    environment:
      PARKMASTER_ALLOWED_ORIGINS: ${PARKMASTER_PUBLIC_URL}
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-}

  parkmaster:
    container_name: parkmaster-web
    build:
      context: ${PARKMASTER_SOURCE_DIR}
      dockerfile: deploy/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    environment:
      PARKMASTER_SUPABASE_URL: ${PARKMASTER_PUBLIC_URL}
      PARKMASTER_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${ANON_KEY}}
      PARKMASTER_NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      PARKMASTER_DEPLOYMENT_MODE: on_premises
      PARKMASTER_EXTERNAL_AI_ENABLED: ${AI_ENABLED:-false}
      PARKMASTER_SENSOR_CONSOLE_URL: ${SENSOR_CONSOLE_URL:-}
    ports:
      - "${PARKMASTER_BIND_ADDRESS:-0.0.0.0}:80:80/tcp"
      - "${PARKMASTER_BIND_ADDRESS:-0.0.0.0}:443:443/tcp"
    volumes:
      - ${PARKMASTER_TLS_DIR}/cert.pem:/etc/nginx/tls/cert.pem:ro
      - ${PARKMASTER_TLS_DIR}/key.pem:/etc/nginx/tls/key.pem:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
